<!doctype html>
<html lang="ru">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Служба качества · Primelab Knowledge Agent</title>
  <link rel="stylesheet" href="/assets/site.css">
</head>
<body>
<main>
  <a href="/">К вопросам</a>
  <h1>Служба качества</h1>
  <form id="lookup">
    <label for="key">Ключ сотрудника</label>
    <input id="key" type="password" autocomplete="off" required>
    <label for="case-id">Номер запроса</label>
    <input id="case-id" pattern="[0-9a-f]{32}" required>
    <button>Открыть запрос</button>
  </form>
  <details>
    <summary>Проверить ответ, который уже есть в регламенте</summary>
    <form id="new-case">
      <label for="review-unit">Подразделение</label>
      <select id="review-unit" required>
        <option value="dbrct">ДБРЦТ</option><option value="security">Дирекция ИБ</option>
        <option value="technical">Техническая дирекция</option>
      </select>
      <label for="review-question">Вопрос для проверки</label>
      <input id="review-question" minlength="2" maxlength="1400" required>
      <button>Создать запрос на проверку</button>
    </form>
  </details>
  <div id="status" role="status"></div>
  <form id="review" hidden>
    <p id="original"></p>
    <label for="point">Связанный пункт регламента</label>
    <select id="point" required></select>
    <label for="resolution" id="resolution-label">Подтверждённый ответ</label>
    <textarea id="resolution" rows="5" minlength="5" maxlength="3000" required></textarea>
    <label for="alternative">Альтернативная формулировка</label>
    <input id="alternative" maxlength="1400" aria-describedby="alternative-hint">
    <p id="alternative-hint">Необязательно. Укажите вопрос с тем же смыслом для этого подразделения.</p>
    <label for="conflict-note">Причина расхождения с регламентом</label>
    <textarea id="conflict-note" rows="2" minlength="5" maxlength="1000" aria-describedby="conflict-hint"></textarea>
    <p id="conflict-hint">Укажите причину расхождения для дополнительного согласования.</p>
    <button id="review-submit">Подтвердить и добавить в базу знаний</button>
  </form>
</main>
<script>
  const get = (id) => document.getElementById(id);
  const review = get('review');
  const status = get('status');
  let opened = null;
  get('conflict-note').addEventListener('input', () => {
    get('review-submit').textContent = get('conflict-note').value.trim()
      ? 'Передать на дополнительное согласование' : 'Подтвердить и добавить в базу знаний';
  });
  async function request(path, body) {
    const headers = {'X-Quality-Key': get('key').value};
    if (body) headers['Content-Type'] = 'application/json';
    const response = await fetch(path, {method: body ? 'POST' : 'GET', headers, body: body && JSON.stringify(body)});
    const data = await response.json();
    if (!response.ok) throw new Error(typeof data.detail === 'string' ? data.detail : 'Проверьте заполнение полей.');
    return data;
  }
  async function openCase(id) {
    const data = await request('/quality/case/' + id);
    opened = data.case.id;
    get('case-id').value = opened;
    get('original').textContent = data.case.question;
    const options = data.points.map((point) => new Option(
      point.document + ' · п. ' + point.point, JSON.stringify(point),
    ));
    get('point').replaceChildren(new Option('Выберите пункт', ''), ...options);
    for (const option of options) {
      const item = JSON.parse(option.value);
      if (item.document === data.case.document && item.point === data.case.point) get('point').value = option.value;
    }
    get('resolution').value = data.case.resolution || '';
    get('alternative').value = data.case.alternative || '';
    get('conflict-note').value = data.case.conflict_note || '';
    status.textContent = data.case.escalated_at ? 'Запрос ожидает дополнительного согласования.'
      : data.case.approved_at ? 'Сохранённый ответ подтверждён.' : 'Запрос ожидает подтверждения.';
    get('resolution-label').textContent = data.case.escalated_at
      ? 'Предложение эксперта (ожидает согласования)' : 'Подтверждённый ответ';
    get('conflict-note').dispatchEvent(new Event('input'));
    for (const field of review.querySelectorAll('input, select, textarea, button')) {
      field.disabled = Boolean(data.case.escalated_at);
    }
    review.hidden = false;
  }
  async function loadCase(event, getId) {
    event.preventDefault();
    const button = event.target.querySelector('button');
    button.disabled = true;
    opened = null;
    review.hidden = true;
    try {
      await openCase(await getId());
    } catch (error) {
      status.textContent = error.message;
    } finally {
      button.disabled = false;
    }
  }
  get('lookup').addEventListener('submit', (event) => loadCase(event, () => get('case-id').value.trim()));
  get('new-case').addEventListener('submit', (event) => loadCase(event, async () => {
    const data = await request('/quality/review', {
      question: get('review-question').value.trim(), unit: get('review-unit').value,
    });
    return data.case_id;
  }));
  review.addEventListener('submit', async (event) => {
    event.preventDefault();
    const button = review.querySelector('button');
    button.disabled = true;
    try {
      const {document, point} = JSON.parse(get('point').value);
      const result = await request('/quality/approve', {
        case_id: opened, document, point, resolution: get('resolution').value,
        alternative: get('alternative').value.trim() || null,
        conflict_note: get('conflict-note').value.trim() || null,
      });
      status.textContent = result.status === 'escalated'
        ? 'Запрос передан на дополнительное согласование. Действующий пункт сохранён.'
        : 'Ответ подтверждён и добавлен в локальную базу знаний.';
      review.hidden = true;
    } catch (error) {
      status.textContent = error.message;
    } finally {
      button.disabled = false;
    }
  });
</script>
</body>
</html>
